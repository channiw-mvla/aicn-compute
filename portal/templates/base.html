<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AICN{% endblock %}</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2029; --panel2:#232b36; --line:#2e3a48;
    --text:#e6edf3; --muted:#8b98a5; --accent:#4aa8ff; --ok:#3fb950; --bad:#f85149;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:15px/1.55 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:14px 22px;
    background:var(--panel); border-bottom:1px solid var(--line); }
  header a.brand { color:var(--text); font-weight:700; letter-spacing:.4px; text-decoration:none; font-size:16px; }
  header .brand span { color:var(--accent); }
  header .spacer { margin-left:auto; }
  header a, header form { color:var(--muted); }
  header nav a { color:var(--muted); text-decoration:none; margin-left:16px; font-size:14px; }
  header nav a:hover { color:var(--text); }
  header .who { color:var(--muted); font-size:13px; margin-left:16px; }
  .wrap { max-width:440px; margin:48px auto; padding:0 20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 22px; font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input[type=email], input[type=password], input[type=text] {
    width:100%; padding:11px 12px; font:inherit; color:var(--text);
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; }
  input:focus { outline:none; border-color:var(--accent); }
  button.primary { width:100%; margin-top:20px; padding:11px 12px; font:inherit; font-weight:600;
    background:var(--accent); color:#06121f; border:none; border-radius:8px; cursor:pointer; }
  button.primary:hover { filter:brightness(1.08); }
  button.link { background:none; border:none; color:var(--muted); cursor:pointer; font:inherit; padding:0; text-decoration:underline; }
  .muted { color:var(--muted); font-size:13px; }
  .alt { margin-top:18px; text-align:center; color:var(--muted); font-size:14px; }
  .alt a { color:var(--accent); text-decoration:none; }
  .error { background:rgba(248,81,73,.12); border:1px solid rgba(248,81,73,.4); color:#ffb3ae;
    border-radius:8px; padding:10px 12px; font-size:14px; margin-bottom:6px; }
  .hero { max-width:640px; margin:80px auto; padding:0 20px; text-align:center; }
  .hero h1 { font-size:34px; margin-bottom:12px; }
  .hero p { color:var(--muted); font-size:17px; margin:0 auto 28px; max-width:520px; }
  .btns { display:flex; gap:12px; justify-content:center; }
  .btn { padding:11px 22px; border-radius:8px; text-decoration:none; font-weight:600; font-size:15px; }
  .btn.solid { background:var(--accent); color:#06121f; }
  .btn.ghost { border:1px solid var(--line); color:var(--text); }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">AI<span>CN</span></a>
  <div class="spacer"></div>
  <nav>
    {% if request and request.cookies.get('aicn_session') %}
      <a href="/dashboard">Dashboard</a>
      <form action="/logout" method="post" style="display:inline; margin-left:16px;">
        <button class="link" type="submit">Log out</button>
      </form>
    {% else %}
      <a href="/login">Log in</a>
      <a href="/register">Sign up</a>
    {% endif %}
  </nav>
</header>
{% block body %}{% endblock %}
</body>
</html>
