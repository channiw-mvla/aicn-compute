{% extends "base.html" %}
{% block title %}Sign up — AICN{% endblock %}
{% block body %}
<div class="wrap">
  <div class="card">
    <h1>Create your account</h1>
    <p class="sub">Sign up to create organizations and share servers.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/register">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" required autofocus autocomplete="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="new-password"
             minlength="8" placeholder="At least 8 characters">
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" required autocomplete="new-password">
      <button class="primary" type="submit">Create account</button>
    </form>
    <div class="alt">Already have an account? <a href="/login">Log in</a></div>
  </div>
</div>
{% endblock %}
