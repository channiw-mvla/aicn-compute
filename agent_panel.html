<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AICN — Local node panel</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2029; --panel2: #232b36; --line: #2e3a48;
    --text: #e6edf3; --muted: #8b98a5; --accent: #4aa8ff;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --busy: #a371f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  header h1 .id { color: var(--accent); }
  .tag { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: #30363d; color: var(--muted); }
  .tag.up { background: rgba(63,185,80,.15); color: var(--ok); }
  .tag.down { background: rgba(248,81,73,.15); color: var(--bad); }
  #conn { margin-left: auto; }
  #tokenbar { display: none; align-items: center; gap: 6px; margin-left: auto; }
  #tokenbar input { width: 200px; padding: 5px 9px; font-size: 12px; color: var(--text);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 20px; max-width: 1100px; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 12px; }
  .statline { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.available { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.busy { background: var(--busy); box-shadow: 0 0 8px var(--busy); }
  .dot.off { background: var(--muted); }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 12px; }
  .badge.available { background: rgba(63,185,80,.15); color: var(--ok); }
  .badge.busy { background: rgba(163,113,247,.15); color: var(--busy); }
  .badge.off { background: #30363d; color: var(--muted); }
  .specs { color: var(--muted); font-size: 13px; display: grid; gap: 7px; }
  .specs .row { display: grid; grid-template-columns: 66px 1fr; gap: 10px; align-items: start; }
  .specs .k { color: #5a6673; text-transform: uppercase; font-size: 10px; letter-spacing: .5px; padding-top: 2px; }
  .specs b { color: var(--text); font-weight: 600; }
  .gpu-row .vendor { color: var(--busy); font-size: 11px; text-transform: uppercase; }
  .util { display: grid; gap: 9px; }
  .bar { display: grid; grid-template-columns: 52px 1fr 90px; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
  .bar .k { color: #5a6673; text-transform: uppercase; font-size: 10px; letter-spacing: .5px; }
  .bar .track { height: 10px; background: #0d1117; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
  .bar .fill.mid { background: var(--warn); }
  .bar .fill.hi { background: var(--bad); }
  .bar .v { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #06121f; border: none; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); color: #06121f; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button.resume { border-color: var(--ok); color: var(--ok); }
  .pausewrap { margin-bottom: 16px; }
  .win { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); margin-bottom: 8px; }
  .days { display: flex; gap: 4px; }
  .day { width: 30px; text-align: center; padding: 4px 0; font-size: 11px; border: 1px solid var(--line);
    border-radius: 5px; cursor: pointer; color: var(--muted); background: var(--panel); user-select: none; }
  .day.on { background: rgba(74,168,255,.18); border-color: var(--accent); color: var(--accent); }
  .win input[type=time] { width: 110px; padding: 5px 8px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; }
  .win .rm { margin-left: auto; padding: 4px 10px; }
  .sched-actions { display: flex; gap: 8px; margin-top: 10px; }
  .always { color: var(--muted); font-style: italic; font-size: 13px; margin-bottom: 8px; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  .hint { color: var(--muted); font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>
<header>
  <h1>Node · <span class="id" id="nodeName">…</span> <span class="hint">local panel</span></h1>
  <span id="tokenbar">
    <span class="tag">token</span>
    <input id="tokenInput" type="password" placeholder="panel token" autocomplete="off">
  </span>
  <span id="conn" class="tag">connecting…</span>
</header>

<div class="wrap">
  <div class="card">
    <h2>Status</h2>
    <div class="statline">
      <span class="dot off" id="dot"></span>
      <span class="badge off" id="badge">—</span>
      <span class="tag" id="gwTag">gateway: ?</span>
    </div>
    <div class="specs" id="specs"><div class="empty">Loading…</div></div>
  </div>

  <div class="card">
    <h2>Live utilization</h2>
    <div class="util" id="util"><div class="empty">No telemetry yet.</div></div>
  </div>

  <div class="card wide">
    <h2>Controls</h2>
    <div class="pausewrap">
      <button id="pauseBtn" class="primary">Pause</button>
      <span class="hint">Pausing stops new jobs; a job already running finishes.</span>
    </div>
    <h2 style="margin-top:4px">Availability schedule</h2>
    <div id="alwaysNote" class="always">No windows set — the node is always available. Add a window to restrict it.</div>
    <div id="windows"></div>
    <div class="sched-actions">
      <button id="addWin">+ Add window</button>
      <button id="saveSched" class="primary">Save schedule</button>
    </div>
  </div>
</div>

<script>
const TOKEN_REQUIRED = "{{TOKEN_REQUIRED}}";   // replaced with true/false by the agent
const $ = id => document.getElementById(id);
let token = localStorage.getItem("aicn_panel_token") || "";
let scheduleTouched = false;
let loaded = false;
let lastState = null;

document.title = "AICN — local panel";

function setConn(cls, text) { const el = $("conn"); el.className = "tag " + cls; el.textContent = text; }
function headers(extra) { return Object.assign(token ? { "X-AICN-Token": token } : {}, extra || {}); }
function needToken() {
  $("tokenbar").style.display = "flex";
  setConn("down", "token required");
}

async function poll() {
  try {
    const r = await fetch("/api/state", { headers: headers() });
    if (r.status === 401) { needToken(); return; }
    const s = await r.json();
    setConn("up", "agent online");
    $("tokenbar").style.display = "none";
    render(s);
  } catch (e) {
    setConn("down", "agent unreachable");
  }
}

async function control(action, extra) {
  try {
    const r = await fetch("/api/control", {
      method: "POST",
      headers: headers({ "Content-Type": "application/json" }),
      body: JSON.stringify(Object.assign({ action }, extra || {})),
    });
    if (r.status === 401) { needToken(); return; }
    const j = await r.json();
    if (!j.ok) { alert("Control failed: " + (j.error || "unknown")); return; }
    if (j.state) render(j.state);
  } catch (e) {
    alert("Could not reach the agent.");
  }
}

function render(s) {
  lastState = s;
  $("nodeName").textContent = s.node_id || "?";
  document.title = "AICN — " + (s.node_id || "node");

  const paused = !!s.paused;
  const state = (paused || !s.available) ? "off" : (s.current_job ? "busy" : "available");
  const label = paused ? "paused" : (!s.available ? "unavailable" : (s.current_job ? "running" : "available"));
  $("dot").className = "dot " + state;
  $("badge").className = "badge " + state; $("badge").textContent = label;
  $("gwTag").className = "tag " + (s.connected ? "up" : "down");
  $("gwTag").textContent = s.connected ? "gateway: connected" : "gateway: offline";

  const hw = s.hardware || {};
  const cores = (hw.cores && hw.cores !== hw.cpu) ? `${hw.cores} cores / ${hw.cpu} threads` : `${hw.cpu ?? "?"} threads`;
  let gpuHtml;
  if (hw.gpus && hw.gpus.length) {
    gpuHtml = hw.gpus.map(g => `<div class="gpu-row">${esc(g.name || "GPU")}`
      + (g.vendor ? ` <span class="vendor">${esc(g.vendor)}</span>` : "")
      + (g.vram_mb ? ` · ${fmtMB(g.vram_mb)}` : "") + `</div>`).join("");
  } else gpuHtml = "none";
  $("specs").innerHTML = `
    <div class="row"><span class="k">Host</span><span>${[hw.hostname, hw.os, hw.arch].filter(Boolean).map(esc).join(" · ") || "?"}</span></div>
    <div class="row"><span class="k">CPU</span><span><b>${esc(hw.cpu_model || "?")}</b><br>${cores}</span></div>
    <div class="row"><span class="k">RAM</span><span><b>${fmtMB(hw.ram_mb)}</b></span></div>
    <div class="row"><span class="k">GPU</span><span>${gpuHtml}</span></div>
    <div class="row"><span class="k">Sandbox</span><span>${esc(s.sandbox || "?")}</span></div>
    <div class="row"><span class="k">Job</span><span>${s.current_job ? esc(s.current_job) : "<span style='color:var(--muted)'>idle</span>"}</span></div>`;

  const st = s.stats || {};
  let u = bar("CPU", st.cpu_percent) + bar("RAM", st.ram_percent, st.ram_used_mb != null ? fmtMB(st.ram_used_mb) : null);
  (st.gpus || []).forEach((g, i) => {
    const memPct = (g.mem_percent != null) ? g.mem_percent
      : (g.mem_used_mb != null && g.mem_total_mb) ? 100 * g.mem_used_mb / g.mem_total_mb : null;
    const memVal = (g.mem_used_mb != null && g.mem_total_mb) ? `${fmtMB(g.mem_used_mb)}/${fmtMB(g.mem_total_mb)}` : null;
    const multi = st.gpus.length > 1;
    u += bar(multi ? `GPU${i}` : "GPU", g.util_percent) + bar(multi ? `VRAM${i}` : "VRAM", memPct, memVal);
  });
  $("util").innerHTML = u;

  const pb = $("pauseBtn");
  pb.textContent = paused ? "Resume" : "Pause";
  pb.className = paused ? "primary resume" : "primary";

  if (!loaded || !scheduleTouched) { renderScheduleEditor(s.schedule || []); loaded = true; }
}

function bar(label, pct, extra) {
  const has = pct != null && !isNaN(pct);
  const p = has ? Math.max(0, Math.min(100, Math.round(pct))) : 0;
  const cls = !has ? "" : (p >= 85 ? "hi" : p >= 60 ? "mid" : "");
  const v = extra != null ? extra : (has ? p + "%" : "—");
  return `<div class="bar"><span class="k">${esc(label)}</span>`
    + `<span class="track"><span class="fill ${cls}" style="width:${p}%"></span></span>`
    + `<span class="v">${esc(v)}</span></div>`;
}

// -- schedule editor --
const DAYS = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
function renderScheduleEditor(sched) {
  const box = $("windows"); box.innerHTML = "";
  (sched || []).forEach(w => box.appendChild(makeWindowRow(w)));
  updateAlwaysNote();
}
function makeWindowRow(w) {
  w = w || {};
  const on = Array.isArray(w.days) ? w.days : [0, 1, 2, 3, 4, 5, 6];
  const row = document.createElement("div"); row.className = "win";
  const days = document.createElement("div"); days.className = "days";
  DAYS.forEach((d, i) => {
    const b = document.createElement("div");
    b.className = "day" + (on.includes(i) ? " on" : ""); b.textContent = d; b.dataset.day = i;
    b.onclick = () => { b.classList.toggle("on"); scheduleTouched = true; };
    days.appendChild(b);
  });
  const start = document.createElement("input"); start.type = "time"; start.value = w.start || "22:00";
  const end = document.createElement("input"); end.type = "time"; end.value = (w.end === "24:00" ? "23:59" : (w.end || "06:00"));
  [start, end].forEach(inp => inp.oninput = () => { scheduleTouched = true; });
  const dash = document.createElement("span"); dash.textContent = "→"; dash.style.color = "var(--muted)";
  const rm = document.createElement("button"); rm.className = "rm danger"; rm.textContent = "remove";
  rm.onclick = () => { row.remove(); scheduleTouched = true; updateAlwaysNote(); };
  row.append(days, start, dash, end, rm);
  return row;
}
function updateAlwaysNote() { $("alwaysNote").style.display = $("windows").children.length ? "none" : "block"; }
function collectSchedule() {
  return [...$("windows").children].map(row => {
    const days = [...row.querySelectorAll(".day.on")].map(d => parseInt(d.dataset.day, 10)).sort((a, b) => a - b);
    const [start, end] = row.querySelectorAll("input[type=time]");
    return { days, start: start.value || "00:00", end: end.value || "24:00" };
  });
}

function fmtMB(mb) { return mb ? (mb >= 1024 ? (mb / 1024).toFixed(1) + " GB" : mb + " MB") : "?"; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

$("pauseBtn").addEventListener("click", () => control(lastState && lastState.paused ? "resume" : "pause"));
$("addWin").addEventListener("click", () => {
  $("windows").appendChild(makeWindowRow({ days: [0, 1, 2, 3, 4], start: "22:00", end: "06:00" }));
  scheduleTouched = true; updateAlwaysNote();
});
$("saveSched").addEventListener("click", () => { control("set_schedule", { schedule: collectSchedule() }); scheduleTouched = false; });
$("tokenInput").value = token;
$("tokenInput").addEventListener("input", () => { token = $("tokenInput").value.trim(); localStorage.setItem("aicn_panel_token", token); poll(); });

if (TOKEN_REQUIRED && !token) needToken();
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
